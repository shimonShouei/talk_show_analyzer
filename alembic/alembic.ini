# Alembic configuration file

[alembic]
# Path to migration scripts directory
sqlalchemy.url =

# Template to use
script_location = alembic

# File logging level
file_logging_level = INFO

# Console output level
console_logging_level = INFO

# Default revision level
## version_location_template = %(rev)s_%(slug)s

# Capture table info from the database
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
