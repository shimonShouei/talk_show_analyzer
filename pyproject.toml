[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talk-show-analyzer"
version = "0.1.0"
description = "Automated analysis of Israeli radio talk shows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Shimon", email = "shimon@example.com"}]
dependencies = [
    # Audio processing
    "faster-whisper>=1.0.0",           # Free Whisper inference
    "pyannote.audio>=4.0,<5.0",        # Free diarization (v4 + community-1 model)
    "librosa>=0.10.0",                 # Audio utilities
    "pydub>=0.25.1",                   # Audio manipulation

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",          # PostgreSQL driver

    # LLM/API
    "anthropic>=0.28.0",               # Claude API

    # ML utilities
    "scikit-learn>=1.3.0",             # AgglomerativeClustering for acoustic speaker merging

    # Configuration & utils
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "tenacity>=8.2.0",                 # Retry logic

    # Dashboard
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "pandas>=2.0.0",

    # Logging & monitoring
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
